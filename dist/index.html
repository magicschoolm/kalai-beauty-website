<!doctype html>
<!--
  index.html - the ONE html file of a React app.
  Look at <body>: there is just an empty <div id="root"></div>.
  React fills that div with everything you see. That is the key difference
  from the old Astro site, where every page was its own .html file.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#faf8ff" />
    <link rel="icon" type="image/jpeg" href="/logo.jpeg" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Google Fonts: Cormorant Garamond (headings) + Outfit (body text) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Outfit:wght@300;400;500&display=swap"
      rel="stylesheet"
    />

    <!--
      The title/description here are fallbacks. Real per-page values are set
      in React by <Seo /> (see src/components/Seo.jsx).
    -->
    <title>Kalai's beauty &amp; academy</title>
    <meta
      name="description"
      content="Bridal makeup, salon services and a 10-day beautician course in Vadavalli, Coimbatore."
    />
    <script type="module" crossorigin src="/assets/index-DXD5NxjS.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-BfyMRo0r.css">
  </head>
  <body>
    <!-- React renders the whole app into this one div. -->
    <div id="root"></div>

    <!-- This is the JavaScript entry point. It loads src/main.jsx. -->
  </body>
</html>
